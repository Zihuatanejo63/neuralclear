services:
  neuralclear:
    build: .
    ports:
      - "8000:8000"
    environment:
      NEURALCLEAR_MODE: ${NEURALCLEAR_MODE:-sandbox}
      NEURALCLEAR_API_KEY: ${NEURALCLEAR_API_KEY:?NEURALCLEAR_API_KEY is required}
      NEURALCLEAR_DB: ${NEURALCLEAR_DB:-/data/neuralclear.db}
    volumes:
      - neuralclear-data:/data

volumes:
  neuralclear-data:
